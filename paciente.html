<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Pacientes</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<h1>Gestión de Pacientes</h1>

<button class="btn-crear" onclick="abrirModalCrearPaciente()">➕ Crear Paciente</button>
<a href="./menuestatico.html"><button class="btn-eliminar">🏰 Ir Atras</button></a>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Documento</th>
      <th>Nombre</th>
      <th>Teléfono</th>
      <th>Correo</th>
      <th>Dirección</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="tabla-pacientes">
    <!-- Se cargan dinámicamente -->
  </tbody>
</table>

<!-- Modal -->
<div class="modal" id="modal-paciente">
  <div class="modal-content">
    <span class="close-modal" onclick="cerrarModalPaciente()">×</span>
    <h2 id="modal-titulo-paciente">Crear Paciente</h2>
    <input type="text" id="documento" placeholder="Documento" />
    <input type="text" id="nombre" placeholder="Nombre" />
    <input type="text" id="telefono" placeholder="Teléfono" />
    <input type="email" id="correo" placeholder="Correo" />
    <input type="text" id="direccion" placeholder="Dirección" />
    <div class="modal-actions">
      <button onclick="guardarPaciente()" class="btn-crear" id="btn-guardar-paciente">Guardar</button>
    </div>
  </div>
</div>
<script src="js/paciente.js"></script>
</body>
</html>
